name: Bug report
description: Something on the site doesn't work or looks broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome 141
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ..."
