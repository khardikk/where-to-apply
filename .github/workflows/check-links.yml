# Weekly dead-link check for src/data/sources.ts. A red run means a source moved or died.
name: Check links

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
